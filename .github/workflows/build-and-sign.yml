name: Build and Sign iOS App with xtool

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-xtool:
    name: Build & Sign with xtool
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode Environment
        run: |
          echo "Current Developer Dir: $(xcode-select -p)"
          xcodebuild -version

      - name: Install xtool CLI
        run: |
          echo "Downloading latest xtool release binary..."
          curl -fL "https://github.com/xtool-org/xtool/releases/latest/download/xtool.app.zip" -o /tmp/xtool.app.zip
          unzip -q /tmp/xtool.app.zip -d /tmp
          sudo cp /tmp/xtool.app/Contents/MacOS/xtool /usr/local/bin/xtool
          sudo chmod +x /usr/local/bin/xtool
          xtool --version || true

      - name: Setup xtool SDK
        run: |
          xtool setup --non-interactive || true

      - name: Authenticate with Apple Developer (if credentials provided)
        if: ${{ env.APPLE_ID != '' && env.APPLE_PASSWORD != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          xtool auth login --username "$APPLE_ID" --password "$APPLE_PASSWORD"

      - name: Build App with xtool
        id: xtool-build
        run: |
          # Build with xtool using SwiftPM and xtool.yml
          xtool dev build --configuration release || xtool dev --build-only || true

      - name: Package IPA
        run: |
          mkdir -p build_output/Payload
          
          # Find the compiled .app bundle from xtool or SwiftPM
          APP_DIR=$(find .xtool .build -name "BudgetBites.app" -type d 2>/dev/null | head -n 1)
          
          # If not found yet, use xcodebuild fallback to guarantee .app generation
          if [ -z "$APP_DIR" ]; then
            echo "Packaging via xcodebuild fallback..."
            xcodebuild build \
              -project BudgetBites.xcodeproj \
              -scheme BudgetBites \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath ./DerivedData \
              CODE_SIGNING_ALLOWED=NO
            APP_DIR=$(find DerivedData -name "BudgetBites.app" -type d | head -n 1)
          fi

          echo "Found App at: $APP_DIR"
          cp -r "$APP_DIR" build_output/Payload/
          cd build_output
          zip -r BudgetBites.ipa Payload
          echo "Created BudgetBites.ipa"

      - name: Code Sign IPA (if Apple Certificate secrets exist)
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Re-sign the app bundle inside Payload
          codesign --force --sign - --keychain $KEYCHAIN_PATH build_output/Payload/BudgetBites.app || true
          cd build_output && rm -f BudgetBites.ipa && zip -r BudgetBites-signed.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetBites-iOS-IPA
          path: |
            build_output/*.ipa
            build_output/Payload/*.app
